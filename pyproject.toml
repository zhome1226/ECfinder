[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecfinder"
version = "0.1.0"
description = "Traceable stage-1 PFAS environmental transformation literature evidence pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pandas>=2",
  "pdfplumber>=0.11",
  "pypdf>=5",
  "pyyaml>=6",
  "requests>=2.32"
]

[project.scripts]
ecfinder = "ecfinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
